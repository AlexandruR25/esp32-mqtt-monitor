<!DOCTYPE html>
<html lang="ro">
<head>
    <title>ESP32 Dashboard Dual</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

    <style>
        /* --- STILURI GENERALE --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent-hot: #ff7675;
            --accent-wet: #74b9ff;
            --accent-soil: #fdcb6e; 
            --accent-pump: #55efc4; 
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        h1 {
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            width: 90%;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            width: 250px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); }

        .icon-box { font-size: 3rem; margin-bottom: 15px; }
        
        .temp-icon { color: var(--accent-hot); filter: drop-shadow(0 0 10px rgba(255, 118, 117, 0.5)); }
        .hum-icon { color: var(--accent-wet); filter: drop-shadow(0 0 10px rgba(116, 185, 255, 0.5)); }
        .soil-icon { color: var(--accent-soil); filter: drop-shadow(0 0 10px rgba(253, 203, 110, 0.5)); }
        .pump-icon { color: var(--accent-pump); filter: drop-shadow(0 0 10px rgba(85, 239, 196, 0.5)); }

        .label { font-size: 1rem; opacity: 0.8; text-transform: uppercase; margin-bottom: 10px; }
        .value { font-size: 2.5rem; font-weight: 600; }

        /* --- STIL MENIU DROPDOWN --- */
        .custom-select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            appearance: none; /* Ascunde săgeata default */
            outline: none;
            text-align: center;
        }
        
        .custom-select option {
            background-color: #2d3436;
            color: white;
        }

        /* --- STIL BUTON TRIMITE --- */
        .btn-pump {
            background: var(--accent-pump);
            color: #2d3436;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 0 15px rgba(85, 239, 196, 0.4);
        }
        
        .btn-pump:hover { 
            background: #fff; 
            transform: scale(1.05);
        }

        .btn-pump:disabled {
            background: rgba(255,255,255,0.2);
            color: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-bar {
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
        }

        .led {
            width: 12px; height: 12px; border-radius: 50%;
            background-color: #555; box-shadow: 0 0 5px #555;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .led.connected { background-color: #00b894; box-shadow: 0 0 10px #00b894; }
        .led.error { background-color: #d63031; box-shadow: 0 0 10px #d63031; }
        .led.connecting { background-color: #fdcb6e; box-shadow: 0 0 10px #fdcb6e; }

        .pulse-update { animation: text-flash 0.5s ease-out; }
        @keyframes text-flash {
            0% { color: white; transform: scale(1); }
            50% { color: #ffeaa7; transform: scale(1.1); }
            100% { color: white; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1><i class="fas fa-network-wired"></i> Sistem Monitorizare</h1>

    <div class="dashboard">
        <div class="card">
            <div class="icon-box"><i class="fas fa-temperature-high temp-icon"></i></div>
            <div class="label">Temperatură</div>
            <div id="temperatura" class="value">--°C</div>
        </div>

        <div class="card">
            <div class="icon-box"><i class="fas fa-tint hum-icon"></i></div>
            <div class="label">Umiditate Aer</div>
            <div id="umiditate" class="value">--%</div>
        </div>

        <div class="card">
            <div class="icon-box"><i class="fas fa-seedling soil-icon"></i></div>
            <div class="label">Umiditate Sol</div>
            <div id="sol" class="value">--%</div>
        </div>

        <div class="card">
            <div class="icon-box"><i class="fas fa-water pump-icon"></i></div>
            <div class="label">Programare Udare</div>
            
            <select id="water-duration" class="custom-select">
                <option value="PUMP_2SEC">Udare 2 Secunde</option>
                <option value="PUMP_5SEC" selected>Udare 5 Secunde</option>
                <option value="PUMP_10SEC">Udare 10 Secunde</option>
            </select>
            
            <button id="btn-send" class="btn-pump" onclick="sendWateringCommand()">
                TRIMITE COMANDA
            </button>
            
            <div id="pump-status" style="margin-top:10px; font-size:0.8rem; color:#aaa;">Pompă Oprită</div>
        </div>
    </div>
    
    <div class="status-bar">
        <div id="led-status" class="led"></div>
        <span id="status-text">Se inițializează...</span>
    </div>

    <script>
        // --- CONFIGURARE MQTT ---
        const MQTT_HOST = "45529ea6f341410aa5a4fd3d6d0509b8.s1.eu.hivemq.cloud"; 
        const MQTT_PORT = 8884;
        const MQTT_USER = "esp_1";
        const MQTT_PASS = "Oananebunamea12!";
        
        const MQTT_TOPIC_SOL     = "esp/device1/data"; 
        const MQTT_TOPIC_AER     = "esp/device2/data"; 
        const MQTT_TOPIC_CMD     = "esp32/cmd"; 
        const MQTT_TOPIC_CONFIRM = "esp/device1/confirm";
        
        let lastUpdateTimestamp = null;

        const client = new Paho.MQTT.Client(
            MQTT_HOST, 
            MQTT_PORT, 
            "/mqtt", 
            "web_dashboard_" + parseInt(Math.random() * 1000, 10)
        );

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;
        
        const statusText = document.getElementById("status-text");
        const statusLed = document.getElementById("led-status");
        const sendBtn = document.getElementById("btn-send");
        const pumpStatusLabel = document.getElementById("pump-status");

        setInterval(updateLastSeenText, 30000); 

        connect();

        function setStatus(state, message) {
            statusText.innerText = message;
            statusLed.className = "led " + state; 
        }

        function updateLastSeenText() {
            if (!lastUpdateTimestamp || !client.isConnected()) return;
            const now = Date.now();
            const diffMs = now - lastUpdateTimestamp;
            const diffMins = Math.floor(diffMs / 60000); 

            let timeMessage = diffMins < 1 ? "Actualizat: chiar acum" : "Actualizat: acum " + diffMins + " min";
            statusText.innerText = timeMessage;
            statusLed.className = "led connected";
        }

        function connect() {
            setStatus("connecting", "Se conectează la server...");
            client.connect({
                userName: MQTT_USER,
                password: MQTT_PASS,
                useSSL: true,
                onSuccess: onConnect,
                onFailure: onFailure
            });
        }

        function onConnect() {
            setStatus("connected", "Conectat. Aștept date...");
            client.subscribe(MQTT_TOPIC_SOL);
            client.subscribe(MQTT_TOPIC_AER);
            client.subscribe(MQTT_TOPIC_CONFIRM);
            console.log("Abonat la topics.");
        }

        function onFailure(responseObject) {
            setStatus("error", "Eroare conexiune!");
            setTimeout(connect, 5000);
        }

        function onConnectionLost(responseObject) {
            setStatus("error", "Conexiune pierdută!");
            setTimeout(connect, 5000);
        }

        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;

            try {
                const data = JSON.parse(payload);
                
                // DATA SOL
                if (topic === MQTT_TOPIC_SOL) {
                    if(data.soil_pct !== undefined) updateValue("sol", parseInt(data.soil_pct) + " %");
                    if(data.pump !== undefined) updatePumpStatusLabel(data.pump == 1 || data.pump === true);
                    markUpdate();
                }
                // DATA AER
                else if (topic === MQTT_TOPIC_AER) {
                    if(data.temp !== undefined) updateValue("temperatura", parseFloat(data.temp).toFixed(1) + " °C");
                    if(data.humidity !== undefined) updateValue("umiditate", parseFloat(data.humidity).toFixed(1) + " %");
                    markUpdate();
                }
                // CONFIRMARI
                else if (topic === MQTT_TOPIC_CONFIRM) {
                    if (data.status.includes("ON") || data.status.includes("START")) {
                        updatePumpStatusLabel(true);
                    } else {
                        updatePumpStatusLabel(false);
                    }
                    
                    // Daca primim confirmare ca s-a terminat programul, reactivam butonul
                    if (data.status === "PROGRAMMED_DONE") {
                        sendBtn.disabled = false;
                        sendBtn.innerText = "TRIMITE COMANDA";
                    }
                }

            } catch (e) { console.error(e); }
        }

        function markUpdate() {
            lastUpdateTimestamp = Date.now();
            updateLastSeenText();
            statusLed.style.boxShadow = "0 0 15px #fff";
            setTimeout(() => { statusLed.style.boxShadow = ""; }, 200);
        }

        function updateValue(elementId, text) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            el.classList.remove("pulse-update");
            void el.offsetWidth; 
            el.classList.add("pulse-update");
        }

        function updatePumpStatusLabel(isOn) {
            if(isOn) {
                pumpStatusLabel.innerText = "POMPĂ PORNITĂ";
                pumpStatusLabel.style.color = "#55efc4";
                pumpStatusLabel.style.fontWeight = "bold";
            } else {
                pumpStatusLabel.innerText = "Pompă Oprită";
                pumpStatusLabel.style.color = "#aaa";
                pumpStatusLabel.style.fontWeight = "normal";
            }
        }

        // --- FUNCTIA NOUA DE PROGRAMARE ---
        function sendWateringCommand() {
            if (!client.isConnected()) {
                alert("Nu ești conectat la MQTT!");
                return;
            }

            // Luam valoarea selectata din meniu (PUMP_2SEC, PUMP_5SEC, etc.)
            const select = document.getElementById("water-duration");
            const command = select.value;
            const text = select.options[select.selectedIndex].text;

            if(confirm("Confirmi programarea: " + text + "?\n(Se va executa la următoarea trezire a plăcuței)")) {
                
                const message = new Paho.MQTT.Message(command);
                message.destinationName = MQTT_TOPIC_CMD;
                
                // RETINEM MESAJUL PANA SE TREZESTE PLACUTA
                message.retained = true; 
                
                client.send(message);
                
                // Feedback vizual
                sendBtn.disabled = true;
                sendBtn.innerText = "PROGRAMAT...";
                
                setTimeout(() => {
                    sendBtn.disabled = false;
                    sendBtn.innerText = "TRIMITE COMANDA";
                }, 3000);
            }
        }
    </script>
</body>
</html>
